name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q scripts tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Exercise command interface
        run: python scripts/lunarmarch.py --help
      - name: Validate context evaluation plan
        run: python scripts/context_eval.py plan --suite evals/context-efficiency/suite.json --repetitions 1
